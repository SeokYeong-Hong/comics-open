server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/comicsopen;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.forward-headers-strategy=framework
server.error.include-message=never
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB
comics.fastapi.base-url=${FASTAPI_BASE_URL:http://127.0.0.1:8000}

spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
